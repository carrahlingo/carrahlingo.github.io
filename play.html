<script>
document.querySelector('.lava-lamp').addEventListener('click', function () {
  this.classList.toggle('is-on');
  this.setAttribute('aria-pressed', this.classList.contains('is-on'));
});

document.querySelector('.bluetooth-speaker').addEventListener('click', function () {
  var popup = document.querySelector('.spotify-popup');
  var iframe = document.getElementById('spotify-iframe');
  if (!iframe.src && iframe.dataset.src) {
    iframe.src = iframe.dataset.src;
  }
  popup.classList.toggle('is-open');
  this.setAttribute('aria-pressed', String(popup.classList.contains('is-open')));
});
</script>
