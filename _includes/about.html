<script>
(function () {
  var wall = document.querySelector('.gallery-wall');
  if (!wall) return;

  wall.addEventListener('click', function (e) {
    // Don't toggle caption when clicking a link
    if (e.target.closest('a')) return;

    var frame = e.target.closest('.gw-frame');
    if (!frame) {
      wall.querySelectorAll('.gw-frame--active').forEach(function (f) {
        f.classList.remove('gw-frame--active');
      });
      return;
    }
    var wasActive = frame.classList.contains('gw-frame--active');
    wall.querySelectorAll('.gw-frame--active').forEach(function (f) {
      f.classList.remove('gw-frame--active');
    });
    if (!wasActive) {
      frame.classList.add('gw-frame--active');
    }
  });
})();
</script>
</section>
