<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Notebook body -->
  <rect x="30" y="10" width="150" height="240" rx="4" ry="4" fill="#4a6741" stroke="#3a5331" stroke-width="2"/>
  <!-- Spine -->
  <rect x="30" y="10" width="20" height="240" rx="4" ry="4" fill="#3a5331"/>
  <!-- Cover label area -->
  <rect x="65" y="60" width="100" height="50" rx="3" ry="3" fill="#f5f0e8" opacity="0.9"/>
  <!-- Lines on label -->
  <line x1="75" y1="75" x2="155" y2="75" stroke="#c4b8a8" stroke-width="1"/>
  <line x1="75" y1="85" x2="155" y2="85" stroke="#c4b8a8" stroke-width="1"/>
  <line x1="75" y1="95" x2="135" y2="95" stroke="#c4b8a8" stroke-width="1"/>
  <!-- Elastic band -->
  <line x1="145" y1="10" x2="145" y2="250" stroke="#2d3d27" stroke-width="2"/>
</svg>
