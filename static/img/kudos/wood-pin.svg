<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Streaky wood grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.22" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.20  0 0 0 0 0.08  0 0 0 2.4 -0.85"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="hl" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="base" cx="42%" cy="38%" r="65%">
      <stop offset="0" stop-color="#d9ab76"/>
      <stop offset="0.6" stop-color="#bf8752"/>
      <stop offset="1" stop-color="#94602f"/>
    </radialGradient>
    <radialGradient id="shade" cx="40%" cy="35%" r="62%">
      <stop offset="0.55" stop-color="#3a2210" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a2210" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="head"><circle cx="29" cy="27" r="20"/></clipPath>
  </defs>
  <!-- Cast shadow falls down and to the right, since the pin stands off the card -->
  <ellipse cx="36" cy="37" rx="19" ry="17" fill="#000" opacity="0.32" filter="url(#soft)"/>
  <circle cx="29" cy="27" r="20" fill="url(#base)"/>
  <g clip-path="url(#head)">
    <g transform="rotate(-28 29 27)"><rect x="-10" y="-10" width="84" height="84" filter="url(#grain)" opacity="0.95"/></g>
    <circle cx="29" cy="27" r="20" fill="url(#shade)"/>
    <ellipse cx="22" cy="19" rx="7" ry="4.5" fill="#fff4e2" opacity="0.45" filter="url(#hl)" transform="rotate(-30 22 19)"/>
  </g>
  <circle cx="29" cy="27" r="19.6" fill="none" stroke="#5e3a1c" stroke-opacity="0.35" stroke-width="0.8"/>
</svg>
